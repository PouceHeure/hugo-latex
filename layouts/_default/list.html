{{ define "main" }}
<div class="container list-page">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mt-3">
    {{ range .Pages }}
    <div class="col"><div class="card post-card h-100 p-3 d-flex flex-column">
      <h5><a href="{{ .RelPermalink }}" class="stretched-link">{{ .Title }}</a></h5>
      <div class="post-meta mt-auto">{{ .Date.Format "02 Jan 2006" }}</div>
    </div></div>
    {{ end }}
  </div>
</div>
{{ end }}
